<?xml version="1.0" encoding="UTF-8"?>
<!-- ESP32-S3 SuperMini, drawn for Pinslim (original artwork, same licence as
     the project). 18 x 23.5 mm, 2 x 9 side pads on a 2.54 mm grid, USB-C at
     the top. Pad order after espboards.dev; compare with your board's
     silkscreen, sellers differ in details. 1 user unit = 1 mm. -->
<svg xmlns="http://www.w3.org/2000/svg" width="18mm" height="23.5mm" viewBox="0 0 18 23.5">
  <title>ESP32-S3 SuperMini</title>
  <rect x="0" y="0" width="18" height="23.5" rx="1.2" fill="#17181c"/>
  <rect x="0.25" y="0.25" width="17.5" height="23" rx="1" fill="none" stroke="#2a2c33" stroke-width="0.2"/>
  <!-- USB-C -->
  <rect x="5.4" y="-0.4" width="7.2" height="3.4" rx="1.3" fill="#c9cdd3" stroke="#8d939b" stroke-width="0.15"/>
  <rect x="6.6" y="0.6" width="4.8" height="1.4" rx="0.6" fill="#5b6068"/>
  <!-- BOOT / RST -->
  <g fill="#e6e6e6" stroke="#9aa0a6" stroke-width="0.12">
    <rect x="5.3" y="3.7" width="2.2" height="1.6" rx="0.3"/>
    <rect x="10.5" y="3.7" width="2.2" height="1.6" rx="0.3"/>
  </g>
  <circle cx="6.4" cy="4.5" r="0.45" fill="#b8bcc2"/>
  <circle cx="11.6" cy="4.5" r="0.45" fill="#b8bcc2"/>
  <text x="6.4" y="6.3" font-size="0.62" fill="#d9d9d9" text-anchor="middle" font-family="Arial, sans-serif">BOOT</text>
  <text x="11.6" y="6.3" font-size="0.62" fill="#d9d9d9" text-anchor="middle" font-family="Arial, sans-serif">RST</text>
  <!-- ESP32-S3 module -->
  <rect x="5.3" y="7.4" width="7.4" height="7.4" rx="0.4" fill="#2e3036" stroke="#4a4d55" stroke-width="0.15"/>
  <rect x="6.0" y="8.1" width="6.0" height="6.0" rx="0.3" fill="#3a3d44"/>
  <text x="9" y="10.9" font-size="0.95" fill="#cfd3d8" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">ESP32</text>
  <text x="9" y="12.2" font-size="0.95" fill="#cfd3d8" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">S3</text>
  <!-- RGB LED (GPIO48) -->
  <rect x="8.3" y="15.6" width="1.4" height="1.4" rx="0.2" fill="#f2f2f2" stroke="#999" stroke-width="0.1"/>
  <circle cx="9" cy="16.3" r="0.35" fill="#d0d0d0"/>
  <!-- ceramic antenna -->
  <rect x="5.6" y="19.6" width="6.8" height="2.2" rx="0.3" fill="#e8e3d6" stroke="#b9b29f" stroke-width="0.12"/>
  <rect x="6.2" y="20.3" width="5.6" height="0.8" fill="#c9c1aa"/>
  <!-- pads -->
  <circle cx="1.2" cy="2.10" r="0.78" fill="#d4a72c"/><circle cx="1.2" cy="2.10" r="0.42" fill="#0e0e10"/><circle cx="16.8" cy="2.10" r="0.78" fill="#d4a72c"/><circle cx="16.8" cy="2.10" r="0.42" fill="#0e0e10"/><circle cx="1.2" cy="4.64" r="0.78" fill="#d4a72c"/><circle cx="1.2" cy="4.64" r="0.42" fill="#0e0e10"/><circle cx="16.8" cy="4.64" r="0.78" fill="#d4a72c"/><circle cx="16.8" cy="4.64" r="0.42" fill="#0e0e10"/><circle cx="1.2" cy="7.18" r="0.78" fill="#d4a72c"/><circle cx="1.2" cy="7.18" r="0.42" fill="#0e0e10"/><circle cx="16.8" cy="7.18" r="0.78" fill="#d4a72c"/><circle cx="16.8" cy="7.18" r="0.42" fill="#0e0e10"/><circle cx="1.2" cy="9.72" r="0.78" fill="#d4a72c"/><circle cx="1.2" cy="9.72" r="0.42" fill="#0e0e10"/><circle cx="16.8" cy="9.72" r="0.78" fill="#d4a72c"/><circle cx="16.8" cy="9.72" r="0.42" fill="#0e0e10"/><circle cx="1.2" cy="12.26" r="0.78" fill="#d4a72c"/><circle cx="1.2" cy="12.26" r="0.42" fill="#0e0e10"/><circle cx="16.8" cy="12.26" r="0.78" fill="#d4a72c"/><circle cx="16.8" cy="12.26" r="0.42" fill="#0e0e10"/><circle cx="1.2" cy="14.80" r="0.78" fill="#d4a72c"/><circle cx="1.2" cy="14.80" r="0.42" fill="#0e0e10"/><circle cx="16.8" cy="14.80" r="0.78" fill="#d4a72c"/><circle cx="16.8" cy="14.80" r="0.42" fill="#0e0e10"/><circle cx="1.2" cy="17.34" r="0.78" fill="#d4a72c"/><circle cx="1.2" cy="17.34" r="0.42" fill="#0e0e10"/><circle cx="16.8" cy="17.34" r="0.78" fill="#d4a72c"/><circle cx="16.8" cy="17.34" r="0.42" fill="#0e0e10"/><circle cx="1.2" cy="19.88" r="0.78" fill="#d4a72c"/><circle cx="1.2" cy="19.88" r="0.42" fill="#0e0e10"/><circle cx="16.8" cy="19.88" r="0.78" fill="#d4a72c"/><circle cx="16.8" cy="19.88" r="0.42" fill="#0e0e10"/><circle cx="1.2" cy="22.42" r="0.78" fill="#d4a72c"/><circle cx="1.2" cy="22.42" r="0.42" fill="#0e0e10"/><circle cx="16.8" cy="22.42" r="0.78" fill="#d4a72c"/><circle cx="16.8" cy="22.42" r="0.42" fill="#0e0e10"/>
  <!-- pad labels -->
  <g font-size="0.9" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold">
    <text x="2.15" y="2.42" text-anchor="start">TX</text><text x="15.85" y="2.42" text-anchor="end">5V</text><text x="2.15" y="4.96" text-anchor="start">RX</text><text x="15.85" y="4.96" text-anchor="end">GND</text><text x="2.15" y="7.50" text-anchor="start">1</text><text x="15.85" y="7.50" text-anchor="end">3V3</text><text x="2.15" y="10.04" text-anchor="start">2</text><text x="15.85" y="10.04" text-anchor="end">13</text><text x="2.15" y="12.58" text-anchor="start">3</text><text x="15.85" y="12.58" text-anchor="end">12</text><text x="2.15" y="15.12" text-anchor="start">4</text><text x="15.85" y="15.12" text-anchor="end">11</text><text x="2.15" y="17.66" text-anchor="start">5</text><text x="15.85" y="17.66" text-anchor="end">10</text><text x="2.15" y="20.20" text-anchor="start">6</text><text x="15.85" y="20.20" text-anchor="end">9</text><text x="2.15" y="22.74" text-anchor="start">7</text><text x="15.85" y="22.74" text-anchor="end">8</text>
  </g>
</svg>
