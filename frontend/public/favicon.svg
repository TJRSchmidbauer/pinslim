<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="pinslimPinGrad" x1="0" y1="0" x2="32" y2="0" gradientUnits="userSpaceOnUse">
      <stop stopColor="#00E5FF" offset="0%"/>
      <stop stopColor="#0077FF" offset="100%"/>
    </linearGradient>
    <linearGradient id="pinslimTrackGrad" x1="0" y1="0" x2="32" y2="0" gradientUnits="userSpaceOnUse">
      <stop stopColor="#00E5FF" offset="0%" stopOpacity="0.25"/>
      <stop stopColor="#0077FF" offset="50%" stopOpacity="0.4"/>
      <stop stopColor="#00E5FF" offset="100%" stopOpacity="0.25"/>
    </linearGradient>
    <filter id="pinGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Track: the slim connector bridge -->
  <rect x="4" y="14" width="24" height="4" rx="2" fill="url(#pinslimTrackGrad)" stroke="url(#pinslimPinGrad)" strokeWidth="0.8"/>

  <!-- 7 Pins: the "pins" in Pinslim -->
  <g filter="url(#pinGlow)">
    <circle cx="5.5" cy="16" r="2.6" fill="#0F172A" stroke="url(#pinslimPinGrad)" strokeWidth="0.8"/>
    <circle cx="5.5" cy="16" r="1.5" fill="url(#pinslimPinGrad)"/>
    <circle cx="5.1" cy="15.6" r="0.6" fill="#FFFFFF" fillOpacity="0.6"/>

    <circle cx="9.5" cy="15.5" r="2.6" fill="#0F172A" stroke="url(#pinslimPinGrad)" strokeWidth="0.8"/>
    <circle cx="9.5" cy="15.5" r="1.5" fill="url(#pinslimPinGrad)"/>
    <circle cx="9.1" cy="15.1" r="0.6" fill="#FFFFFF" fillOpacity="0.6"/>

    <circle cx="13.5" cy="16" r="2.6" fill="#0F172A" stroke="url(#pinslimPinGrad)" strokeWidth="0.8"/>
    <circle cx="13.5" cy="16" r="1.5" fill="url(#pinslimPinGrad)"/>
    <circle cx="13.1" cy="15.6" r="0.6" fill="#FFFFFF" fillOpacity="0.6"/>

    <circle cx="17.5" cy="15.5" r="2.6" fill="#0F172A" stroke="url(#pinslimPinGrad)" strokeWidth="0.8"/>
    <circle cx="17.5" cy="15.5" r="1.5" fill="url(#pinslimPinGrad)"/>
    <circle cx="17.1" cy="15.1" r="0.6" fill="#FFFFFF" fillOpacity="0.6"/>

    <circle cx="21.5" cy="16" r="2.6" fill="#0F172A" stroke="url(#pinslimPinGrad)" strokeWidth="0.8"/>
    <circle cx="21.5" cy="16" r="1.5" fill="url(#pinslimPinGrad)"/>
    <circle cx="21.1" cy="15.6" r="0.6" fill="#FFFFFF" fillOpacity="0.6"/>

    <circle cx="25.5" cy="15.5" r="2.6" fill="#0F172A" stroke="url(#pinslimPinGrad)" strokeWidth="0.8"/>
    <circle cx="25.5" cy="15.5" r="1.5" fill="url(#pinslimPinGrad)"/>
    <circle cx="25.1" cy="15.1" r="0.6" fill="#FFFFFF" fillOpacity="0.6"/>

    <circle cx="29.5" cy="16" r="2.6" fill="#0F172A" stroke="url(#pinslimPinGrad)" strokeWidth="0.8"/>
    <circle cx="29.5" cy="16" r="1.5" fill="url(#pinslimPinGrad)"/>
    <circle cx="29.1" cy="15.6" r="0.6" fill="#FFFFFF" fillOpacity="0.6"/>
  </g>

  <!-- Signal flow hint: 3 small dots -->
  <circle cx="11" cy="23" r="1" fill="url(#pinslimPinGrad)" fillOpacity="0.5"/>
  <circle cx="16" cy="23" r="1" fill="url(#pinslimPinGrad)" fillOpacity="0.4"/>
  <circle cx="21" cy="23" r="1" fill="url(#pinslimPinGrad)" fillOpacity="0.3"/>
</svg>