# Publishes the landing page (index.html) and the Jekyll docs to GitHub Pages.
# The legacy "build from branch" mode stopped building after pushes, so the
# site is deployed from here instead.
name: Pages

on:
  push:
    branches: [master]
    paths:
      - index.html
      - docs/**
      - _layouts/**
      - README.md
      - frontend/public/favicon.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
